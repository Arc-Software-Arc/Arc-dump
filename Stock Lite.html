   no network, no claude.ai dependency of any kind.
   ============================================================ */
(function () {
  window.storage = {
    get: function (key) {
      try {
        var v = window.localStorage.getItem(key);
        return Promise.resolve({ value: v === null ? undefined : v });
      } catch (e) {
        return Promise.resolve({ value: undefined });
      }
    },
    set: function (key, value) {
      try {
        window.localStorage.setItem(key, value);
      } catch (e) {
        /* best-effort */
      }
      return Promise.resolve();
    },
  };
})();
